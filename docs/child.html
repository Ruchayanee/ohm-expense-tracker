<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1730" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ค่าใช้จ่าย" />
    <title>ค่าใช้จ่าย: ฝั่งโอม</title>
    <link rel="manifest" href="./child-manifest.webmanifest?v=20260810-app-names" />
    <link rel="stylesheet" href="./styles.css?v=20260810-luxury" />
  </head>
  <body data-view="child">
    <header class="topbar">
      <div>
        <p class="eyebrow">ฝั่งโอม</p>
        <h1>ค่าใช้จ่าย</h1>
      </div>
      <a class="small-link" href="./mother.html">ไปหน้าโอม</a>
    </header>

    <main class="app">
      <section class="summary" aria-label="สรุปยอด">
        <article><span>รายจ่ายรวม</span><strong id="total-expense">฿0</strong></article>
        <article><span>ยอดค้าง</span><strong id="outstanding">฿0</strong></article>
        <article><span>หม่าม๊าโอนแล้ว</span><strong id="paid-total">฿0</strong></article>
        <article><span>จำนวนรายการ</span><strong id="expense-count">0</strong></article>
      </section>

      <section class="layout">
        <form id="expense-form" class="panel">
          <h2>บันทึกรายจ่าย</h2>
          <label class="field">
            <span>วันที่</span>
            <input id="expense-date" type="date" required />
          </label>
          <label class="field">
            <span>หมวดหมู่</span>
            <select id="category" required>
              <option>อาหาร</option>
              <option>เดินทาง</option>
              <option>การเรียน</option>
              <option>ของใช้</option>
              <option>สุขภาพ</option>
              <option>อื่น ๆ</option>
            </select>
          </label>
          <label class="field">
            <span>รายละเอียด</span>
            <textarea id="description" rows="3" required></textarea>
          </label>
          <label class="field">
            <span>จำนวนเงิน</span>
            <input id="amount" type="number" min="1" step="0.01" required />
          </label>
          <button type="submit">บันทึกรายจ่าย</button>
        </form>

        <section class="panel">
          <h2>รายการของโอม</h2>
          <div id="expense-list" class="list"></div>
        </section>
      </section>
    </main>

    <iframe id="sync-frame" name="sync-frame" class="hidden" title="sync"></iframe>
    <form id="sync-form" class="hidden" method="post" target="sync-frame">
      <input id="sync-payload" name="payload" />
    </form>
    <script src="./config.js?v=20260810-sync"></script>
    <script src="./app.js?v=20260810-app-names"></script>
  </body>
</html>
